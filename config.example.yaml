symbols: [EURUSD]
decision_timeframe: M15
context_timeframes: [H4, H1, M15]
bars_per_timeframe: 250

magic_number: 770125          # isolates this bot's trades from everything else
allow_live_account: false     # hard gate: refuses to start on a non-demo account
dry_run: true                 # logs orders without sending them
kill_switch_file: KILL        # create this file to flatten and stop

mt5:
  terminal_path: null         # e.g. C:\Program Files\MetaTrader 5\terminal64.exe

model:
  name: claude-sonnet-5
  max_tokens: 2000
  timeout_seconds: 90

risk:
  max_risk_per_trade_pct: 0.5
  min_risk_per_trade_pct: 0.1
  max_total_risk_pct: 1.5
  max_daily_loss_pct: 3.0
  max_open_positions: 2
  allow_multiple_per_symbol: false
  min_rr: 1.5
  require_take_profit: true
  max_spread_points: 25
  min_stop_spread_multiple: 3.0
  cooldown_after_losses: 3

session:
  timezone: Africa/Kigali
  trading_windows: [["09:00", "22:00"]]   # London + NY overlap in CAT
  trading_days: [0, 1, 2, 3, 4]
  avoid_minutes_around_rollover: 15

strategy_brief: |
  Trade only with H4 structure. Require an H1 break of structure followed by a
  retest into the origin zone. Stops go beyond the swing that created the break,
  never at a fixed distance. Skip anything where the retest is already more than
  50% travelled toward the target.
